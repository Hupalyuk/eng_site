<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
  <main class="page">
    <section class="shell" aria-label="Login layout">
      <div class="hero" aria-hidden="true">
        <img class="hero-img" src="../assets/images/login/login.png" alt="Hero image" />
      </div>
      <div class="card" aria-label="Форма логіну">
        <h1>Welcome to lorem..!</h1>

        <div class="pill-switch" role="tablist" aria-label="Auth switch">
          <button class="pill is-active" role="tab" aria-selected="true">Login</button>
          <button class="pill" role="tab" aria-selected="false">Register</button>
        </div>

        <p class="intro">
          Lorem Ipsum is simply dummy text of the printing and typesetting industry.
        </p>

        <form class="form" autocomplete="on">
          <label class="field">
            <span>User name</span>
            <input type="text" placeholder="Enter your User name" />
          </label>

          <label class="field">
            <span>Password</span>
            <div class="input-with-icon">
              <input type="password" placeholder="Enter your Password" />
              <button class="icon-btn" type="button" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5C6.9 5 3.1 8.3 1.5 12c1.6 3.7 5.4 7 10.5 7s8.9-3.3 10.5-7C20.9 8.3 17.1 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" />
                  <circle cx="12" cy="12" r="2.1" />
                </svg>
              </button>
            </div>
          </label>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a class="link" href="#">Forgot Password ?</a>
          </div>

          <button class="primary" type="submit">Login</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
